# Config as code for the cohi-api control plane.
# https://docs.railway.com/guides/config-as-code
#
# One-click: README "Deploy on Railway" button.
# GitHub: New Project → Deploy from GitHub repo → this repository.
# Postgres: add Railway PostgreSQL and set DATABASE_URL=${{Postgres.DATABASE_URL}}

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
